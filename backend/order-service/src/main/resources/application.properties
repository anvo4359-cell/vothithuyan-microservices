spring.application.name=order-service
server.port=8082

# Database Configuration (SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=order_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQLSERVER_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dia chi cac Microservices
services.product.url=http://localhost:8081

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173
